packages:
  - packages/*
  - packages/mui-envinfo/test
  - packages-internal/*
  - docs
  - test
  - test/*

engineStrict: true
updateNotifier: false
autoDedupe: true
# Restore after https://github.com/mui/mui-public/pull/2118 is released.
blockExoticSubdeps: false
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@mui/*'
  - '@base-ui/*'
# Drop exemptions from minimumReleaseAgeExclude once the lockfile stops resolving them,
# so the security-update entries Renovate adds do not accumulate.
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# Skip trust-policy checks for packages published more than 365 days ago.
# Some widely-used legacy packages (notably semver@6.x — pulled in by @babel/core@7.x — plus
# reselect@5.1.1 and parts of @octokit/*) dropped provenance attestation for specific releases,
# triggering false-positive trust-downgrade errors. Packages that old have had ample time for
# community review; supply-chain risk is most relevant within a shorter window.
# TODO: drop once @babel/core stops depending on semver@^6.3.1 (no 6.x semver release has
# provenance), and the other legacy packages restore provenance.
trustPolicyIgnoreAfter: 525600

catalogs:
  docs:
    # Match @emotion/cache: a newer stylis prefixer throws on its styles. Renovate skips this entry.
    stylis: '4.2.0'
    '@base-ui/react': '^1.9.0'
    '@docsearch/react': '^5.2.0'
    '@emotion/cache': '^11.14.0'
    '@emotion/react': '^11.14.0'
    '@emotion/server': '^11.11.0'
    '@emotion/styled': '^11.14.1'
    '@mui/internal-docs-infra': '0.13.1-canary.38'

overrides:
  # Until https://github.com/mui/mui-public/pull/2118 is released.
  '@mui/internal-docs-infra': https://pkg.pr.new/mui/mui-public/@mui/internal-docs-infra@4e2b2f14
  '@mui/internal-docs-infra>@mui/internal-typescript-api-extractor': 0.1.1-canary.3
  # Bundled twice in the docs build
  'docs>react-is': '19.3.1'
  # Migrated from package.json "resolutions" (pnpm 11 ignores that field).
  caniuse-lite: '^1.0.30001826'
  '@types/node': '22.20.5'
  cross-fetch: '^4.1.0'
  '@pigment-css/react': '0.0.31'
  '@pigment-css/unplugin': '0.0.31'
  '@pigment-css/nextjs-plugin': '0.0.31'
  '@pigment-css/vite-plugin': '0.0.31'

allowBuilds:
  '@vvago/vale': true
  esbuild: true
  nx: true
  sharp: true
  unrs-resolver: true
  '@mui/x-telemetry': false
  core-js: false
  core-js-pure: false

lockfile:
  includeResolutionSettings: true
