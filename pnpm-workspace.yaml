packages:
  - packages/*
  - packages/mui-envinfo/test
  - packages-internal/*
  - docs
  - test
  - test/*

engineStrict: true
enablePrePostScripts: true
updateNotifier: false
# TEMP: disabled for pkg.pr.new testing of mui/mui-public#1875 (@mui/internal-code-infra
# pulls in its own workspace deps as pkg.pr.new URL subdeps). Restore to true once the
# overrides above are removed.
blockExoticSubdeps: false
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@mui/*'
  - '@base-ui/*'
  # Renovate security update: @babel/core@7.29.6
  - '@babel/core@7.29.6'
  # Renovate security update: react-router@8.3.0
  - react-router@8.3.0
  # Renovate security update: next@16.2.11
  - next@16.2.11
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23
trustPolicy: no-downgrade
# Skip trust-policy checks for packages published more than 365 days ago.
# Some widely-used legacy packages (notably semver@6.x — pulled in by @babel/core@7.x — plus
# reselect@5.1.1 and parts of @octokit/*) dropped provenance attestation for specific releases,
# triggering false-positive trust-downgrade errors. Packages that old have had ample time for
# community review; supply-chain risk is most relevant within a shorter window.
# TODO: drop once @babel/core stops depending on semver@^6.3.1 (no 6.x semver release has
# provenance), and the other legacy packages restore provenance.
trustPolicyIgnoreAfter: 525600

catalogs:
  docs:
    stylis: '4.2.0'
    '@base-ui/react': '^1.8.0'
    '@docsearch/react': '^4.7.0'
    '@emotion/cache': '^11.14.0'
    '@emotion/react': '^11.14.0'
    '@emotion/server': '^11.11.0'
    '@emotion/styled': '^11.14.1'

overrides:
  # TEMP: pin to mui-public#1875's pkg.pr.new build until it merges and publishes a real
  # Babel-8 @mui/internal-code-infra. Remove this whole block (and blockExoticSubdeps below)
  # once that lands and this repo's own @mui/internal-* versions are bumped normally.
  '@mui/internal-code-infra': 'https://pkg.pr.new/mui/mui-public/@mui/internal-code-infra@18a123a1f'
  '@mui/internal-netlify-cache': 'https://pkg.pr.new/mui/mui-public/@mui/internal-netlify-cache@18a123a1f'
  '@mui/internal-test-utils': 'https://pkg.pr.new/mui/mui-public/@mui/internal-test-utils@18a123a1f'
  '@mui/internal-babel-plugin-display-name': 'https://pkg.pr.new/mui/mui-public/@mui/internal-babel-plugin-display-name@18a123a1f'
  '@mui/internal-babel-plugin-minify-errors': 'https://pkg.pr.new/mui/mui-public/@mui/internal-babel-plugin-minify-errors@18a123a1f'
  '@mui/internal-babel-plugin-resolve-imports': 'https://pkg.pr.new/mui/mui-public/@mui/internal-babel-plugin-resolve-imports@18a123a1f'
  # Both were bundled twice in the docs build
  'docs>stylis': '4.2.0'
  'docs>react-is': '19.3.0'
  # Migrated from package.json "resolutions" (pnpm 11 ignores that field).
  caniuse-lite: '^1.0.30001810'
  '@types/node': '22.20.4'
  cross-fetch: '^4.1.0'
  '@pigment-css/react': '0.0.31'
  '@pigment-css/unplugin': '0.0.31'
  '@pigment-css/nextjs-plugin': '0.0.31'
  '@pigment-css/vite-plugin': '0.0.31'

allowBuilds:
  '@vvago/vale': true
  esbuild: true
  nx: true
  sharp: true
  unrs-resolver: true
  '@mui/x-telemetry': false
  core-js: false
  core-js-pure: false
