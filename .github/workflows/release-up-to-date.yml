name: Release branch freshness

on:
  pull_request_target:
    # Include retargeting away from master so shared commit statuses are refreshed.
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, closed]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  release-freshness:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    # Merge the shared workflow in mui-public before enabling this caller.
    uses: mui/mui-public/.github/workflows/prs_check-release-up-to-date.yml@460d35b2318dd8bcd3667c391a16ab3c125ce48e # master
