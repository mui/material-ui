name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@93fb2edda2af4fb4ccf786cd1ffe8bb4f8d520f4 # master
    permissions:
      contents: read
      issues: write
