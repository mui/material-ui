name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@ecaf36c894f9e8bc68959b23bf33e45aefeb319c # master
    permissions:
      contents: read
      issues: write
