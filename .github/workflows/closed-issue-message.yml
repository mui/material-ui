name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@c6471a4fe98cb2e52efe7397ff8362569f2ddada # master
    permissions:
      contents: read
      issues: write
