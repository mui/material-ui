name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@9ffe3cf6919c0b4f211bfadb942b63fa70ffcb64 # master
    permissions:
      contents: read
      issues: write
