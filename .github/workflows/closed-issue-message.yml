name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@52b7be572a556459d18a7ebfd71ed5f3b8d8d3e7 # master
    permissions:
      contents: read
      issues: write
