name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@294ab9be74ab24116c64cd734568b8d0a9b30f18 # master
    permissions:
      contents: read
      issues: write
