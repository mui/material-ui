name: Claude CI flake fix

# Runs mui-public's reusable flake-fix workflow against this repo's CircleCI: it triages recent
# failures and, unless dry-run, opens a draft PR proposing a fix. Runs weekly, and can be
# dispatched by hand. This repo already has the four ANTHROPIC_* variables set; Actions must also be
# allowed to create pull requests (Settings → Actions → General).

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: Write nothing to GitHub; show the PR and issue comment it would post in the run summary.
        type: boolean
        default: false
      model:
        description: Optional model override; leave blank to use mui-public's default.
        type: string

permissions: {}

jobs:
  flake-fix:
    permissions:
      actions: read # read this run's referenced_workflows (resolve-ref job)
      id-token: write # Anthropic WIF (triage job)
      contents: write # push the fix branch (publish job)
      pull-requests: write # open the draft PR (publish job)
      issues: write # tracking issue report (publish job)
    uses: mui/mui-public/.github/workflows/claude-flake-fix-workflow.yml@5fabbb1428f3c28e07f7ae4cbe6eb73ecdd55a59 # mui/mui-public#2108 (e2e test, do not merge)
    with:
      dry-run: true # e2e test: never post
      branch: flake-fix-e2e-base # material-ui just before #49879, so both failures are still unfixed
      model: ${{ inputs.model }} # blank falls through to mui-public's central default
      debug: true # always surface the agent's full output in the run log
      circleci-token-environment: flake-fix # master-gated environment holding CIRCLECI_TOKEN
    secrets:
      # The caller must pass the secret across the boundary. It resolves to the environment's
      # CIRCLECI_TOKEN because the fetch job declares that environment.
      circleci-token: ${{ secrets.CIRCLECI_TOKEN }}
