name: Dependabot fix

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  fix:
    # Maximum grant required by the reusable workflow; its agent job only gets read access.
    # The jobs that publish its PRs read the code-infra-auditor App credentials from this
    # repository's `code-infra-auditor` environment, so no secrets are passed.
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      security-events: read
    uses: mui/mui-public/.github/workflows/dependabot-fix-workflow.lock.yml@8589bc79f4570958ccbc2a1162ee25eca72d5708 # code-infra/gh-aw-dependabot-fix
