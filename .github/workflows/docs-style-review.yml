name: Docs style review

# Runs the reusable docs style review on pull requests that change Markdown. The setup it needs is
# in the README's "Agentic workflows" section of mui/mui-public.

on:
  # Pull requests from forks get reviews too. The reusable workflow never checks out the pull
  # request, and only authors with write access get a review.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    # The code-infra-auditor environment its review is published from is restricted to master.
    branches: [master]
    paths: ['**/*.md', '**/*.mdx']

permissions: {}

jobs:
  docs-style-review:
    # Maximum grant required by the reusable workflow; its agent job only gets read access.
    permissions:
      contents: read
      id-token: write # Anthropic WIF
      issues: write # failure reports
      pull-requests: write # the review
    uses: mui/mui-public/.github/workflows/docs-style-review-workflow.lock.yml@440cdb52ea34c33c052f6dd8e0d3a49a3c2b2add # master
    with:
      # Hand-written docs only, one glob per line.
      exclude: |
        **/CHANGELOG*.md
        .github/**
        **/fixtures/**
    # Reusable workflows only get secrets the caller passes. These resolve to the code-infra-auditor
    # environment's secrets, because the jobs that use them run in that environment.
    secrets:
      CODE_INFRA_AUDITOR_CLIENT_ID: ${{ secrets.CODE_INFRA_AUDITOR_CLIENT_ID }}
      CODE_INFRA_AUDITOR_PRIVATE_KEY: ${{ secrets.CODE_INFRA_AUDITOR_PRIVATE_KEY }}
