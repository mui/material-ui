name: Docs style review

# Runs the reusable docs style review hourly, or by hand for one pull request. The setup it needs is
# in the README's "Agentic workflows" section of mui/mui-public.

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request to review, whoever wrote it. Empty polls as on the schedule.
        type: number

permissions: {}

jobs:
  docs-style-review:
    # Maximum grant required by the reusable workflow; its agent job only gets read access.
    permissions:
      actions: read # the cache entries that record reviews
      checks: read
      contents: read
      id-token: write # Anthropic WIF
      issues: write # failure reports
      pull-requests: write # the review
    uses: mui/mui-public/.github/workflows/docs-style-review-workflow.lock.yml@3ab3e6411ce813c74b4f1ecc61d3211b4d032a30 # master
    with:
      pull_request: ${{ inputs.pull_request || 0 }}
      # Hand-written docs only, one glob per line.
      exclude: |
        **/CHANGELOG*.md
        .github/**
        **/fixtures/**
    # Reusable workflows only get secrets the caller passes. These resolve to the code-infra-auditor
    # environment's secrets, because the jobs that use them run in that environment.
    secrets:
      CODE_INFRA_AUDITOR_CLIENT_ID: ${{ secrets.CODE_INFRA_AUDITOR_CLIENT_ID }}
      CODE_INFRA_AUDITOR_PRIVATE_KEY: ${{ secrets.CODE_INFRA_AUDITOR_PRIVATE_KEY }}
