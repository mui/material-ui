name: Claude issue triage

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  triage:
    if: >-
      !github.event.issue.pull_request && github.event.label.name == 'ai: needs-triage'
    # Maximum grant required by the reusable workflow; its model-running job uses read-only GitHub access.
    # Automated fixes and their publisher are disabled in the pinned workflow.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: mui/mui-public/.github/workflows/claude-triage.yml@c025608c1f0746d496278aff1317a6ce8e61abde # master
    with:
      issue-number: ${{ github.event.issue.number }}
      mode: triage
