    branches:
      - 'next'
      - 'v*.x'
      - 'master'
    types: ['closed']

permissions: {}

jobs:
  create_pr:
    name: Create cherry-pick PR
    uses: mui/mui-public/.github/workflows/prs_create-cherry-pick-pr.yml@c13d72d8221b544497ea5dc8cbf44eb9782bd558 # master
    permissions:
      contents: write
      pull-requests: write
