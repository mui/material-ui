name: Create cherry-pick PR
on:
  pull_request_target:
    branches:
      - 'next'
      - 'v*.x'
      - 'master'
    types: ['closed']
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'The merged PR to cherry-pick'
        required: true
        type: string
      target_branch:
        description: 'The branch to cherry-pick onto (e.g. `v7.x`)'
        required: true
        type: string

permissions: {}

jobs:
  create_pr:
    name: Create cherry-pick PR
    uses: mui/mui-public/.github/workflows/prs_create-cherry-pick-pr.yml@73b01ccc61d2096ec1bac12c735482f8d056c917 # master
    permissions:
      contents: write
      pull-requests: write
    with:
      pr_number: ${{ inputs.pr_number }}
      target_branch: ${{ inputs.target_branch }}
